services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64                         # SQL Server images are x86-64 only
    container_name: tcl_dwh_sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer                        # free edition with every feature (columnstore included), not for production
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-4096}
    ports:
      - "127.0.0.1:${MSSQL_PORT:-1433}:1433"      # reachable from this machine only
    volumes:
      - mssqldata:/var/opt/mssql                  # database files survive container restarts
      - ./data:/data:ro                           # CSV files, read-only, for BULK INSERT ... FROM '/data/...'
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s                           # SQL Server needs ~20–30 s to start

volumes:
  mssqldata:
